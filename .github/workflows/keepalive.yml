# Supabase pauses free projects after 7 days with no activity.
# This pings the database every 3 days so the library stays awake.
name: Keep database awake
on:
  schedule:
    - cron: "17 4 */3 * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping Supabase
        run: |
          URL=$(grep -oE 'SUPABASE_URL:\s*"[^"]+"' config.js | sed -E 's/.*"([^"]+)"/\1/')
          KEY=$(grep -oE 'SUPABASE_ANON_KEY:\s*"[^"]+"' config.js | sed -E 's/.*"([^"]+)"/\1/')
          code=$(curl -s -o /dev/null -w "%{http_code}" "$URL/rest/v1/products?select=id&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "Supabase answered $code"
          test "$code" = "200"
